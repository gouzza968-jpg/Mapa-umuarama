name: Baixar dados do OpenStreetMap

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/osm/consulta.overpassql', '.github/workflows/osm.yml']

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Baixar extrato do Sul do Brasil (Geofabrik) e recortar Umuarama
        run: |
          ok=0
          for u in https://download.openstreetmap.fr/extracts/south-america/brazil/south/parana-latest.osm.pbf \
                   http://download.openstreetmap.fr/extracts/south-america/brazil/south/parana-latest.osm.pbf \
                   https://download.geofabrik.de/south-america/brazil/sul-latest.osm.pbf \
                   http://download.geofabrik.de/south-america/brazil/sul-latest.osm.pbf; do
            for i in 1 2 3; do
              echo "baixando $u ($i)"
              if curl -fSL --connect-timeout 30 --retry 2 -o sul.osm.pbf "$u"; then ok=1; break 2; fi
              sleep 10
            done
          done
          test $ok = 1
          ls -la sul.osm.pbf
          osmium extract -b -53.43,-23.86,-53.21,-23.68 sul.osm.pbf -o umu.osm.pbf --overwrite
          osmium tags-filter umu.osm.pbf nwr/highway nwr/waterway n/place nwr/addr:housenumber nwr/amenity nwr/shop nwr/healthcare nwr/craft w/leisure=park w/landuse=residential -o umu-f.osm.pbf --overwrite
          osmium export umu-f.osm.pbf -f geojsonseq -o umu.geojsonseq --overwrite
          mkdir -p dados-osm
          gzip -9 -c umu.geojsonseq > dados-osm/umuarama.geojsonseq.gz
          osmium fileinfo -e umu-f.osm.pbf | grep -E "Number of|timestamp" | head
          date -u +%Y-%m-%d > dados-osm/data.txt
          ls -la dados-osm

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dados-osm
          git commit -m "Dados do OpenStreetMap [skip ci]" || echo "sem mudanças"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
