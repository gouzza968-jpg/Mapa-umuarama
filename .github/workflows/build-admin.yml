name: Gerar APK do Admin

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/build-admin.yml', 'tools/src.html', 'www/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: npm install
      - name: Biblioteca do Supabase
        run: mkdir -p www/vendor && cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js
      - name: Copiar o Mapa 1 (mesmo código do app dos motoboys)
        run: |
          mkdir -p www/mapa/data www/mapa/vendor
          python3 ../tools/build.py
          cp ../www/index.html www/mapa/index.html
          cp ../www/data/mapa.json ../www/data/mapas.json ../www/data/mapa2.json www/mapa/data/
          cp www/vendor/supabase.js www/mapa/vendor/supabase.js
          ls -la www/mapa www/mapa/data
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          cp -r native/res/. android/app/src/main/res/
          cp native/AppUpdatePlugin.java native/MainActivity.java android/app/src/main/java/com/mapaumuarama/admin/
          M=android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />\n    <application#" $M
      - name: Versão e assinatura
        run: |
          VC=$((100 + GITHUB_RUN_NUMBER)); VN="1.$GITHUB_RUN_NUMBER"
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" $G
          sed -i "0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile rootProject.file('..\/..\/native\/mapaumuarama.keystore')\n            storePassword 'mapaumuarama'\n            keyAlias 'mapaumuarama'\n            keyPassword 'mapaumuarama'\n        }\n    }/" $G
          echo "VN=$VN" >> $GITHUB_ENV
          echo "VC=$VC" >> $GITHUB_ENV
      - name: Compilar APK
        working-directory: admin/android
        run: |
          ok=0
          for i in 1 2 3 4; do ./gradlew assembleDebug && ok=1 && break; sleep 40; done
          test $ok = 1
      - uses: actions/upload-artifact@v4
        with:
          name: mapa-admin-apk
          path: admin/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar (Release separado, não afeta o app dos motoboys)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mapa-admin.apk
          gh release create "admin-v$VN" mapa-admin.apk --title "Mapa Admin $VN" --notes "App de administração" --latest=false
          # link fixo, sempre com a versão mais nova: releases/download/admin/mapa-admin.apk
          printf '{"versionCode":%s,"versionName":"%s","url":"https://github.com/%s/releases/download/admin/mapa-admin.apk"}' "$VC" "$VN" "$GITHUB_REPOSITORY" > update.json
          cat update.json
          gh release upload admin mapa-admin.apk update.json --clobber || gh release create admin mapa-admin.apk update.json --title "Mapa Admin (sempre a última versão)" --notes "Link fixo do app de administração" --latest=false
