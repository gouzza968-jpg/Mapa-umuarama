name: Gerar APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths-ignore: ['dados-osm/**', 'tools/osm/**', '.github/workflows/osm.yml', '.github/workflows/limpeza.yml', 'tools/limpeza/**', 'supabase/**', 'README.md', 'mapas/**', 'admin/**', '.github/workflows/build-admin.yml', '.github/workflows/dados-extras.yml', 'dados-extras/**', '.github/workflows/mapa-hora.yml', '.github/workflows/pdf-prefeitura.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar o app (www)
        run: python3 tools/build.py

      - name: Instalar dependências
        run: npm install

      - name: Biblioteca do Supabase (tempo real)
        run: |
          mkdir -p www/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js
          cp node_modules/maplibre-gl/dist/maplibre-gl.js node_modules/maplibre-gl/dist/maplibre-gl.css www/vendor/
          ls -la www/vendor

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone e tela de abertura
        run: |
          cp -r native/res/. android/app/src/main/res/

      - name: Permissões
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in REQUEST_INSTALL_PACKAGES ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION CAMERA FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS WAKE_LOCK RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
          grep -n "uses-permission" $M
          # textos da notificação de localização em segundo plano
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_channel_name">Localização ao vivo</string>\n    <string name="capacitor_background_geolocation_notification_color">\#FF6A1F</string>\n</resources>#' $S
          cat $S

      - name: Plugin de atualização
        run: |
          D=android/app/src/main/java/com/mapaumuarama/app
          cp native/AppUpdatePlugin.java native/MainActivity.java "$D/"

      - name: Versão e assinatura fixa (permite atualizar o app por cima)
        run: |
          VC=$((100 + GITHUB_RUN_NUMBER))
          VN=$(python3 -c "import json;print(json.load(open('version.json'))['latest'])")
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" $G
          sed -i "0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile rootProject.file('..\/native\/mapaumuarama.keystore')\n            storePassword 'mapaumuarama'\n            keyAlias 'mapaumuarama'\n            keyPassword 'mapaumuarama'\n        }\n    }/" $G
          echo "VC=$VC" >> $GITHUB_ENV
          echo "VN=$VN" >> $GITHUB_ENV
          grep -n "versionCode\|versionName\|storeFile" $G

      - name: Compilar APK
        working-directory: android
        run: |
          ok=0
          for i in 1 2 3 4; do
            ./gradlew assembleDebug && ok=1 && break
            echo "Falha ao baixar pacotes; tentando de novo ($i)"; sleep 40
          done
          test $ok = 1

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: mapa-umuarama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar atualização para o app (Release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mapa-umuarama.apk
          TAG="v$VN-b$GITHUB_RUN_NUMBER"
          python3 - <<PY
          import json, os
          v = json.load(open('version.json', encoding='utf-8'))
          tag = os.environ.get('TAG', '$TAG')
          u = {
            "versionCode": int("$VC"), "versionName": "$VN",
            "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/mapa-umuarama.apk",
            "notes": v["versions"][0]["notes"] if v["versions"][0]["version"] == "$VN" else [],
            "changelog": v["versions"]
          }
          json.dump(u, open('update.json', 'w', encoding='utf-8'), ensure_ascii=False)
          open('notes.md', 'w', encoding='utf-8').write("\n".join("- " + n for n in u["notes"]) or "Atualização")
          PY
          cat update.json
          gh release create "$TAG" mapa-umuarama.apk update.json --title "Mapa Umuarama $VN (build $GITHUB_RUN_NUMBER)" --notes-file notes.md --latest
